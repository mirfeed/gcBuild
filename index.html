<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gcsim Config Builder</title>
    <script>
      // saved theme before the first paint (no light/dark flash); 'system' = follow the OS
      try {
        var th = localStorage.getItem('gcbuild.theme');
        if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // errors before React mounts (a module failing to load, an old browser) would otherwise leave a blank page
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount) return;
          var pre = document.createElement('pre');
          pre.style.cssText = 'margin:40px;padding:16px;white-space:pre-wrap;font:13px monospace;color:#f88;background:#1b1f27;border:1px solid #444;border-radius:6px';
          var text = 'The builder failed to start:\n\n' + msg + '\n\n' + navigator.userAgent;
          pre.textContent = text + '\n\n';
          var a = document.createElement('a');
          a.href = 'https://github.com/mirfeed/gcBuild/issues/new?labels=bug&title=' + encodeURIComponent('Start failure') +
            '&body=' + encodeURIComponent('**What happened?**\n\n**Error**\n```text\n' + text.slice(0, 3000) + '\n```');
          a.target = '_blank';
          a.style.color = '#8cf';
          a.textContent = 'Report this on GitHub';
          pre.appendChild(a);
          root.appendChild(pre);
        }
        window.addEventListener('error', function (e) {
          show((e.error && e.error.stack) || e.message || (e.target && (e.target.src || e.target.href) ? 'could not load ' + (e.target.src || e.target.href) : 'unknown error'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && e.reason.stack) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
