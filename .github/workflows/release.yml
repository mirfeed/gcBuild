# Builds the Windows installer and uploads it to a DRAFT GitHub release when a version tag is pushed:
#   npm version 0.2.0        (bumps package.json, commits, tags v0.2.0)
#   git push --follow-tags
# Then open Releases on GitHub, write what changed and press "Publish": installed apps update themselves.
name: Release (Windows app)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match package.json version v$v"; exit 1; fi

      - run: npm ci

      - run: npm run typecheck

      # electron-builder uploads the installer, latest.yml and the .blockmap in parallel; with no release yet each
      # upload creates its own draft. Creating the draft first makes all three land in the same one.
      - name: Create the draft release
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' | grep -qx "$GITHUB_REF_NAME"; then
            echo "release for $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "" --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and upload to a draft release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
